    push_completed: "推送完成"
    pull_completed: "拉取完成"
    usage: "用法: assh-fs sftp <server>"
    usage_get: "用法: get <remote> [local]"
    usage_put: "用法: put <local> [remote]"
    usage_mkdir: "用法: mkdir <path>"
    usage_rmdir: "用法: rmdir <path>"
    usage_rm: "用法: rm <path>"
