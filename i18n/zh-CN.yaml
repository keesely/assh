# ============================================================
# 服务器管理命令
# ============================================================
cmd:
  server:
    flag:
      host: "主机地址（必填）"
      port: "端口"
      user: "用户名"
      login: "用户名（同 --user）"
      password: "密码（省略则交互式输入）"
      identity_file: "密钥文件路径"
      key: "密钥文件路径（同 --identity-file）"
      option: "键值对格式的选项"
      remark: "备注"
      group: "分组"
      clear_password: "清除密码"
      clear_key: "清除密钥文件"
      option_replace: "添加/替换键值对格式的选项"
      filter_group: "按分组筛选"
      search: "按关键字搜索"
      list: "显示变更历史版本"
      host_new: "主机地址（新建时必填）"
    add:
      description: "添加服务器"
      enter_password: "请输入密码: "
      success: "服务器 {{.Name}} 已添加 (v{{.Version}})"
