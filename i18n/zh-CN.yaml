    rm:
      description: "删除服务器"
      success: "服务器 {{.Name}} 已删除"
    mv:
      description: "重命名/移动服务器"
      success: "服务器 {{.Name}} 已移动到 {{.NewName}}"
      error:
        names_required: "需要同时指定 <from> 和 <to> 名称"
    rollback:
      description: "回滚服务器配置到指定版本"
      success: "服务器 {{.Name}} 已回滚到 v{{.Version}}"
      error:
        version_required: "需要版本号（使用 --list 查看可用版本）"
        invalid_version: "无效的版本号: {{.Version}}"
    preview:
      title: "=== 服务器预览 ==="
      name: "名称:"
      host: "地址:"
      port: "端口:"
      user: "用户:"
      auth: "认证:"
      key: "密钥:"
      remark: "备注:"
      options: "选项:"
    changelog:
      title: "{{.Name}} 的变更历史:"
      header:
        version: "版本"
        type: "类型"
        date: "日期"
    confirm:
      prompt: " [Y/n]: "
    password:
      prompt: "请输入密码: "
    auth:
      password_key: "密码+密钥"
      password: "密码"
      key: "密钥"
      none: "无"

  # 连接命令
  connect:
    flag:
      host: "主机地址"
      port: "端口"
      user: "用户名"
      login: "用户名（同 --user）"
      password: "密码"
      identity_file: "密钥文件路径"
      key: "密钥文件路径（同 --identity-file）"
      jump: "跳板机链（逗号分隔）：name,@id,user@host[:port]"
    error:
      no_target: "未指定目标：使用 <名称>, <user@host>, 或 -H <host>"
      both_target_host: "不能同时指定 target 和 -H/--host"
      command_required: "命令不能为空"
    login:
      description: "SSH 登录（自动检测：名称 / user@host / -H host）"
      error:
        no_target: "未指定目标：使用 <名称>, <user@host>, 或 -H <host>"
        conflict: "不能同时指定 target 和 -H/--host"
    run:
      description: "在远程服务器上执行命令"
      error:
        name_required: "服务器名称不能为空"
        cmd_required: "命令不能为空"
    bc:
      description: "批量执行命令"
      flag:
        servers: "逗号分隔的服务器列表"
        group: "服务器分组"
        port_override: "端口覆盖"
        user_override: "用户名覆盖"
        password_override: "密码覆盖"
        log: "输出日志路径（默认：./bc-result-{timestamp}.json）"
      error:
        cmd_required: "命令不能为空"
        servers_or_group_required: "需要 --servers 或 --group 参数"
        no_target: "需要 --servers 或 --group 参数"
        no_servers: "没有可执行的服务器"
        get_group: "获取分组 {{.Group}} 失败: {{.Error}}"
        write_result: "写入结果失败: "
      output:
        result_written: "结果已写入 {{.Path}}"
        result_error: "写入结果失败: {{.Error}}"

  # 升级命令
  upgrade:
    description: "检查并升级 ASSH 到最新版本"
    flag:
      check_only: "仅检查更新，不升级"
      version: "升级到指定版本"
      force: "强制升级（跳过版本检查）"
      rollback: "回滚到上一版本"
      yes: "自动确认（无提示）"
    current_version: "当前版本: {{.Version}}"
    checking: "正在检查更新..."
    up_to_date: "已是最新版本!"
    new_version: "发现新版本: {{.Version}}"
    release_date: "发布日期: {{.Date}}"
    download_size: "下载大小: {{.Size}}"
    release_notes: "发布说明:"
    rolling_back: "正在回滚到上一版本..."
    rollback_success: "回滚成功!"
    confirm: "是否升级? [y/N]: "
    cancelled: "升级已取消"
    downloading: "正在下载更新..."
    downloading_progress: "下载中: {{.Percent}} ({{.Current}}/{{.Total}})"
    success: "已成功升级到 {{.Version}}!"
    restart_hint: "请重启 ASSH 以使用新版本"
    error:
      service_unavailable: "升级服务不可用"

  # 健康检查命令
  health:
    description: "检查服务器健康状态"
    flag:
      details: "显示系统详情（运行时间/负载/内存/磁盘）"
      group: "仅检查指定分组"
      concurrency: "最大并发检查数"
    check:
      status: "状态"
      latency: "延迟"
      checked: "检查时间"
      error: "错误"
      system_info: "--- 系统信息 ---"
      uptime: "运行时间"
      load: "负载"
      memory: "内存"
      disk: "磁盘"
      healthy: "健康"
      unhealthy: "异常"
      timeout: "超时"
    result:
      server: "{{.Icon}} {{.Server}} ({{.Host}}:{{.Port}})"
      status: "  状态:     {{.Status}}"
      latency: "  延迟:     {{.Latency}}"
      checked: "  检查时间: {{.Checked}}"
      error: "  错误:     {{.Error}}"
      system_info: "  --- 系统信息 ---"
      uptime: "  运行时间: {{.Uptime}}"
      load: "  负载:     {{.Load}}"
      memory: "  内存:     {{.Memory}}"
      disk: "  磁盘:     {{.Disk}}"
    list:
      header: "服务器\t状态\t延迟\t错误"
      total: "总计: {{.Count}} | "
      healthy: "✓ {{.Count}} 健康"
      unhealthy: "⚠ {{.Count}} 异常"
      timeout: "⏱ {{.Count}} 超时"
      error: "✗ {{.Count}} 错误"
    error:
      service_unavailable: "健康检查服务不可用"

  # 密钥生成命令
  keygen:
    description: "生成 SSH 密钥对"
    flag:
      type: "密钥类型: rsa|ed25519|ecdsa"
      bits: "密钥位数（RSA/ECDSA）"
      output: "输出路径（目录或文件路径，独立模式）"
      comment: "密钥注释（默认: user@host）"
      passphrase: "私钥密码短语（默认: 账户密码）"
      host: "主机地址（直连模式）"
      user: "用户名（直连模式）"
      login: "用户名（同 --user）"
      port: "SSH 端口（直连模式）"
      password: "密码（直连模式）"
    success: "SSH 密钥对生成成功"
    success_direct: "SSH 密钥对生成成功（直连模式）"
    info:
      server: "  服务器:     {{.Server}}"
      type: "  类型:       {{.Type}} ({{.Bits}} 位)"
      comment: "  注释:       {{.Comment}}"
      key_file: "  密钥文件:   {{.Path}}"
      auth_password_key: "  认证:       密码+密钥"
      auth_key: "  认证:       密钥"
      private_key: "  私钥: {{.Path}}"
      public_key: "  公钥: {{.Path}}"
      fingerprint: "  指纹: {{.Fingerprint}}"
      public_key_contents: "  公钥内容:"
      host: "  主机:       {{.Host}}:{{.Port}}"
      user: "  用户:       {{.User}}"
      deployed: "信息: 公钥已部署到 {{.User}}@{{.Host}}:{{.Port}}"
      already_exists: "信息: 公钥已存在于 {{.User}}@{{.Host}}:{{.Port}}（已跳过）"
    warning:
      deploy_failed: "警告: 部署公钥失败: {{.Error}}"
      record_failed: "警告: 记录已知服务器失败: {{.Error}}"
      backup_failed: "警告: 更新密钥备份路径失败: {{.Error}}"
    interactive:
      generating: "正在生成公/私 SSH 密钥对。"
      type_prompt: "密钥类型 (rsa/ed25519/ecdsa) [{{.Default}}]: "
      bits_prompt: "密钥位数 [{{.Default}}]: "
      file_prompt: "输入保存密钥的文件 ({{.Default}}): "
      passphrase: "输入密码短语（无密码短语直接回车）: "
      passphrase_confirm: "再次输入密码短语: "
    error:
      passphrase_mismatch: "密码短语不匹配"

  # 代理命令
  proxy:
    description: "启动 SOCKS5/HTTP CONNECT 代理（Smart Proxy 模式）"
    description_long: |
      通过 SSH 隧道启动代理。

      示例:
        assh proxy myserver                          # SOCKS5 :1080（默认）
        assh proxy myserver --socks5 :1080 --http :8080  # SOCKS5 + HTTP CONNECT
        assh proxy myserver --auth user:pass         # 带认证
        assh proxy myserver --daemon                 # 后台守护进程
        assh proxy myserver --auto-reconnect=3/5s    # 自动重连
        assh proxy -H 192.168.1.1 -u root -P pass   # 直连模式
        assh proxy myserver --autoproxy ./list.txt   # AutoProxy 规则
        assh proxy myserver --reverse --ports 80:3000  # 反向代理
        assh proxy rule reload                       # 热加载规则
    flag:
      socks: "SOCKS5 代理监听地址（本地，默认 :1080）"
      socks5: "--socks 的别名（已弃用）"
      http: "HTTP CONNECT 代理监听地址"
      tcp: "TCP 代理监听地址"
      reverse: "反向代理模式（目标为本地）"
      listen_type: "远程服务器监听类型: tcp|http"
      ports: "端口映射规则（如 80,443:80）"
      auth: "代理认证（user:pass）"
      autoproxy: "AutoProxy 规则文件路径"
      log_dir: "代理日志目录"
      daemon: "后台运行（守护进程模式）"
      reconnect: "自动重连 [重试次数/]间隔（如 3/5s）"
      jump: "跳板机链（逗号分隔）: name,@id,user@host[:port]"
    error:
      service_unavailable: "代理服务不可用"
    rules:
      description: "管理 AutoProxy 规则"
      reload:
        description: "从文件重新加载 AutoProxy 规则"
      status:
        description: "显示 AutoProxy 规则状态"
      loaded: "AutoProxy 规则已加载（通过 --autoproxy 检查状态）"
    log:
      description: "查看代理会话日志"
      viewer_tbd: "会话日志 {{.Session}}:（日志查看器待实现）"

  # 隧道命令
  tunnel:
    description: "管理 SSH 端口转发隧道"
    description_long: |
      启动 SSH 端口转发隧道。

      示例:
        assh tunnel myserver -L 8080:localhost:80        # 本地转发
        assh tunnel myserver -R 8080:localhost:80        # 远程转发
        assh tunnel myserver -L 80:web:80 -L 443:web:443  # 多端口转发
        assh tunnel myserver -L 8080:localhost:80 --daemon  # 后台运行
        assh tunnel stop <id>                            # 停止隧道
        assh tunnel list                                 # 列出隧道
    flag:
      local: "本地转发规则 [bind_addr:]port:host:hostport"
      remote: "远程转发规则 [bind_addr:]port:host:hostport"
      listen_type: "监听类型: tcp|http"
      daemon: "后台运行（守护进程模式）"
      reconnect: "自动重连 [重试次数/]间隔"
      jump: "跳板机链（逗号分隔）: name,@id,user@host[:port]"
    stop:
      description: "停止运行中的隧道"
    list:
      description: "列出所有运行中的隧道"
      empty: "没有活动的隧道"
      header:
        id: "ID"
        type: "类型"
        local: "本地"
        remote: "远程"
      total: "总计: {{.Count}} 个隧道"
    error:
      service_unavailable: "代理服务不可用"
      spec_required: "至少需要一个 -L 或 -R 参数"
      invalid_local: "无效的 -L 规则: %q（预期 [bind_addr:]port:host:hostport）"
      invalid_remote: "无效的 -R 规则: %q（预期 [bind_addr:]port:host:hostport）"
      no_forward: "至少需要一个 -L 或 -R 参数"
      invalid_spec: "无效的 {{.Type}} 规范: {{.Spec}}（预期 [bind_addr:]port:host:hostport）"

  # 云同步命令
  sync:
    description: "云同步服务器配置"
    flag:
      access_key: "七牛云 Access Key"
      secret_key: "七牛云 Secret Key"
      bucket: "七牛云 Bucket 名称"
      zone: "七牛云区域 (huadong/huabei/huanan/beimei/xinjiapo)"
    account:
      description: "配置云同步账户"
      set:
        description: "配置或更新云账户（交互式）"
      show:
        description: "显示当前云账户信息"
      delete:
