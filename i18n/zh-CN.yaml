        host: "地址"
        ver: "版本"
        auth: "认证"
        remark: "备注"
    info:
      description: "显示服务器详情"
      title: "服务器详情"
      not_found: "服务器 {{.Name}} 未找到，是否指 [{{.Suggestion}}]？"
    warning:
      key_failed: "警告: 密钥处理失败: {{.Error}}"
    key_file: "密钥文件: {{.Path}}"
