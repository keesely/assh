# ASSH Translation Template
# Version: v2.3.0
# 
# This is a template file for adding new languages.
# To add a new language:
# 1. Copy this file to <language-code>.yaml (e.g., ja-JP.yaml, ko-KR.yaml)
# 2. Translate all values (keep the keys unchanged)
# 3. Update internal/i18n/i18n.go to add the language to SupportedLanguages
# 4. Update i18n/zh-CN.yaml and i18n/en-US.yaml if new keys are added
#
# Template variables use {{.VariableName}} syntax.
# Example: "Server {{.Name}} added" -> "サーバー {{.Name}} が追加されました"

